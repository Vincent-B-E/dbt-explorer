models:
  # models/ root
  - name: postings
    description: Clean job-posting records, with source error rows removed.
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_id
        description: Posting ID from the source; it can repeat when a job is scraped more than once.

  - name: top_skills
    description: Count of distinct postings mentioning each skill keyword.
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: skill_keyword
        description: Skill keyword, such as SQL or Python.
        data_tests:
          - not_null
          - unique
      - name: jobs
        description: Number of distinct postings mentioning the skill.

  # models/menu/
  - name: jobs_monthly
    description: Total posting count by month.
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: month
        description: Month of the posting, truncated from search_date.
      - name: total_postings
        description: Number of postings in the month.

  - name: platform_share
    description: Posting counts by platform, with the 'via ' prefix removed.
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: platform
        description: Job platform name without the 'via ' prefix.
        data_tests:
          - not_null
          - unique
      - name: postings
        description: Number of postings attributed to the platform.

  - name: schedule_mix
    description: Posting counts by schedule type; missing schedule types are labeled 'Not specified'.
    columns:
      - name: schedule
        data_tests:
          - not_null
          - unique
      - name: postings
        description: Number of postings with this schedule type.

  - name: top_companies
    description: Top 50 employers by posting count, excluding job boards that repost listings for other firms.
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: company_name
        description: Hiring company, excluding the filtered job boards.
        data_tests:
          - not_null
          - unique
      - name: postings
        description: Number of postings attributed to the company.

  # models/role_scorecard/
  - name: salary_posts
    description: Postings with a listed salary, including the parsed pay period.
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_id
        description: Posting ID for a posting that lists a salary.
      - name: role
        description: Role searched for in the posting data.
      - name: company_name
        description: Company listed on the posting.
      - name: job_salary
        description: Original salary text from the posting.
      - name: pay_period
        description: "Parsed salary period: year, hour, day, week, or month."
        data_tests:
          - not_null

  - name: skills_by_role
    description: Distinct posting counts for each skill keyword and role.
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: role
        description: Role searched for in the posting data.
      - name: skill_keyword
        description: Skill keyword, such as SQL or Python.
      - name: role_skill
        description: Combined role and skill label.
        data_tests:
          - not_null
          - unique
      - name: jobs
        description: Number of distinct postings for this role and skill.

  - name: remote_by_role
    description: Percentage of postings marked as remote, grouped by role.
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: role
        description: Role searched for in the posting data.
        data_tests:
          - not_null
          - unique
      - name: pct_remote
        description: Percentage of postings marked as remote.

  - name: role_scorecard
    description: One row per role, comparing posting volume, remote share, salary availability, and most-mentioned skill.
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: role
        description: Role searched for in the posting data.
        data_tests:
          - not_null
          - unique
      - name: postings
        description: Number of postings for the role.
      - name: pct_remote
        description: Percentage of postings marked as remote.
      - name: pct_with_salary
        description: Percentage of postings that list a salary.
      - name: top_skill
        description: Skill keyword with the highest posting count for the role.
